<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>A Little Surprise 🎀</title>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      overflow: hidden;

      font-family: Arial, sans-serif;

      background:
        radial-gradient(
          circle at 15% 20%,
          #ffd8e5,
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 80%,
          #e8dcff,
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #fff1f6,
          #faf5ff
        );
    }


    .card {

      width: 88%;

      max-width: 390px;

      padding: 38px 25px;

      text-align: center;

      background: rgba(255,255,255,0.78);

      backdrop-filter: blur(15px);

      border: 1px solid rgba(255,255,255,0.8);

      border-radius: 30px;

      box-shadow:
        0 20px 50px rgba(100,60,100,0.15);

      animation: cardIn 0.8s ease;
    }


    .emoji {

      font-size: 52px;

      margin-bottom: 8px;

      animation: floating 2.5s ease-in-out infinite;
    }


    h1 {

      margin: 5px 0 18px;

      color: #d94f7d;

      font-size: 28px;
    }


    #question {

      color: #555;

      font-size: 18px;

      line-height: 1.6;

      min-height: 85px;

      display: flex;

      justify-content: center;

      align-items: center;
    }


    button {

      border: none;

      padding: 13px 24px;

      margin: 6px;

      border-radius: 30px;

      font-size: 16px;

      font-weight: bold;

      color: white;

      background:
        linear-gradient(
          135deg,
          #ff8fab,
          #e96b91
        );

      box-shadow:
        0 7px 18px rgba(233,107,145,0.25);

      transition: 0.2s;
    }


    button:active {

      transform: scale(0.92);
    }


    .birthdayTitle {

      font-size: 30px;

      animation:
        birthdayPop 0.8s ease infinite alternate;
    }


    .floating {

      position: fixed;

      bottom: -40px;

      font-size: 20px;

      pointer-events: none;

      animation: rise linear forwards;
    }


    @keyframes cardIn {

      from {

        opacity: 0;

        transform:
          translateY(30px)
          scale(0.9);
      }

      to {

        opacity: 1;

        transform:
          translateY(0)
          scale(1);
      }
    }


    @keyframes floating {

      0%,100% {

        transform:
          translateY(0);
      }

      50% {

        transform:
          translateY(-8px);
      }
    }


    @keyframes birthdayPop {

      from {

        transform:
          scale(1);
      }

      to {

        transform:
          scale(1.06);
      }
    }


    @keyframes rise {

      from {

        transform:
          translateY(0)
          rotate(0deg);

        opacity: 0;
      }

      15% {

        opacity: 0.8;
      }

      to {

        transform:
          translateY(-110vh)
          rotate(25deg);

        opacity: 0;
      }
    }

  </style>

</head>


<body>


  <div class="card">


    <div
      class="emoji"
      id="emoji">

      🎀

    </div>


    <h1 id="title">

      Hey Vanya 👀

    </h1>


    <p id="question">

      Do you think today is a special day?

    </p>


    <div id="buttons">


      <button onclick="q1Yes()">

        YES

      </button>


      <button onclick="q1No()">

        NO

      </button>


    </div>


  </div>


  <script>


    /* QUESTION 1 */


    function q1Yes() {

      document.getElementById("question").innerHTML =
        "Do you know why today is special? 👀";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q2Yes()">YES 😌</button>' +

        '<button onclick="q2No()">NO 🤔</button>';

      document.getElementById("emoji").innerHTML =
        "👀";
    }


    function q1No() {

      document.getElementById("question").innerHTML =

        "Hmm... 🤔<br><br>" +
        "Maybe you need a little hint.";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q1Hint()">Give me a hint 🤫</button>';

      document.getElementById("emoji").innerHTML =
        "🤫";
    }


    function q1Hint() {

      document.getElementById("question").innerHTML =

        "Someone very special is involved... 👀";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q1Yes()">Okay, continue →</button>';

      document.getElementById("emoji").innerHTML =
        "✨";
    }



    /* QUESTION 2 */


    function q2Yes() {

      document.getElementById("question").innerHTML =

        "Ohh... you already know? 😌<br><br>" +
        "Let's see if you're right.";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q3()">Next 👀</button>';

      document.getElementById("emoji").innerHTML =
        "😌";
    }


    function q2No() {

      document.getElementById("question").innerHTML =

        "That's okay 🤫<br><br>" +
        "Here's another hint...";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q3()">Give me the hint</button>';

      document.getElementById("emoji").innerHTML =
        "🤫";
    }



    /* QUESTION 3 */


    function q3() {

      document.getElementById("question").innerHTML =

        "Is the special person reading this right now? 👀";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q4()">YES ❤️</button>' +

        '<button onclick="q4()">NO 😭</button>';

      document.getElementById("emoji").innerHTML =
        "👀";
    }



    /* QUESTION 4 */


    function q4() {

      document.getElementById("question").innerHTML =

        "Okay... one last question. 🎁<br><br>" +
        "Are you ready?";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q5()">YES</button>' +

        '<button onclick="q5()">YESSS 🎀</button>';

      document.getElementById("emoji").innerHTML =
        "🎁";
    }



    /* QUESTION 5 */


    function q5() {

      document.getElementById("question").innerHTML =

        "Whose birthday is it? 🎂";

      document.getElementById("buttons").innerHTML =

        '<button onclick="wrongAnswer()">Mine? 👀</button>' +

        '<button onclick="wrongAnswer()">Someone else 🤔</button>' +

        '<button onclick="correctAnswer()">Vanya! ❤️</button>';

      document.getElementById("emoji").innerHTML =
        "🎂";
    }



    /* WRONG ANSWER */


    function wrongAnswer() {

      document.getElementById("question").innerHTML =

        "Hmm... are you sure? 👀<br><br>" +
        "Think again.";

      document.getElementById("buttons").innerHTML =

        '<button onclick="q5()">Try again 🔄</button>';

      document.getElementById("emoji").innerHTML =
        "🤔";
    }



    /* FINAL REVEAL */


    function correctAnswer() {

      document.getElementById("title").innerHTML =

        "HAPPY BIRTHDAY VANYA! 🎂";


      document.getElementById("title")
        .classList.add("birthdayTitle");


      document.getElementById("question").innerHTML =

        "Yep... it was you all along. ❤️<br><br>" +

        "Wishing you a beautiful birthday " +

        "filled with happiness, laughter " +

        "and amazing memories. ✨<br><br>" +

        "Have the best day! 🎀";


      document.getElementById("buttons").innerHTML = "";


      document.getElementById("emoji").innerHTML =
        "🎂";


      startFloating();
    }



    /* FLOATING EMOJIS */


    function startFloating() {

      setInterval(function() {

        const item =
          document.createElement("div");


        item.className =
          "floating";


        const emojis = [

          "❤️",
          "💕",
          "💗",
          "✨",
          "🎀",
          "🌸"

        ];


        item.innerHTML =
          emojis[
            Math.floor(
              Math.random() *
              emojis.length
            )
          ];


        item.style.left =
          Math.random() * 100 + "vw";


        item.style.animationDuration =
          (4 + Math.random() * 3) + "s";


        document.body.appendChild(item);


        setTimeout(function() {

          item.remove();

        }, 7000);


      }, 450);

    }


  </script>


</body>

</html>
